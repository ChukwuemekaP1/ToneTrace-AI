services:
  # ---------------------------------------------------------------------------
  # ToneTrace Backend API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: tonetrace-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_CORS_ORIGINS
        value: '["https://tonetrace.vercel.app","https://tonetrace-web.onrender.com"]'
      - key: DATABASE_URL
        fromDatabase:
          name: tonetrace-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ELASTICSEARCH_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: YOUCAM_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # ToneTrace Frontend Web Application
  # ---------------------------------------------------------------------------
  - type: web
    name: tonetrace-web
    runtime: static
    buildCommand: cd frontend && pnpm install && pnpm build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tonetrace-api.onrender.com/api/*
      - type: rewrite
        source: /health/*
        destination: https://tonetrace-api.onrender.com/health/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: tonetrace-postgres
    plan: standard
    databaseName: tonetrace
    user: tonetrace_admin
